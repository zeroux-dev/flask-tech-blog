<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="ZERO (Sobhan) - t.me/fesqhli">
    <title>ورود</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="auth-page-body">
    <div id="particles-js"></div>
    <div class="auth-box">
        <div class="auth-header">
            <i class="fas fa-fingerprint"></i>
            <h3>خوش آمدید</h3>
            <p>برای دسترسی وارد شوید</p>
        </div>
        
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div style="background:#ffebee; color:#c62828; padding:10px; border-radius:8px; margin-bottom:15px; font-size:13px; text-align:right;">
                    {{ messages[0] }}
                </div>
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('login') }}">
            <input type="text" name="username" class="auth-input" placeholder="نام کاربری" required>
            <div style="position: relative;">
                <input type="password" name="password" id="loginPassField" class="auth-input" placeholder="رمز عبور" required>
                <i class="fas fa-eye show-pass-icon" onclick="toggleLoginPass()"></i>
            </div>
            <button type="submit" class="btn-auth-submit">ورود به حساب</button>
        </form>
        
        <div class="auth-footer">
            حساب کاربری ندارید؟ <a href="/register">عضویت رایگان</a>
            <br><br>
            <a href="/" style="color: #888; font-weight: normal; font-size: 12px; text-decoration: none;">
                <i class="fas fa-arrow-right ms-1"></i> بازگشت به صفحه اصلی
            </a>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        particlesJS("particles-js", { "particles": { "number": { "value": 80 }, "color": { "value": "#4e54c8" }, "shape": { "type": "circle" }, "opacity": { "value": 0.5 }, "size": { "value": 3 }, "line_linked": { "enable": true, "distance": 150, "color": "#4e54c8", "opacity": 0.2, "width": 1 }, "move": { "enable": true, "speed": 2 } }, "interactivity": { "detect_on": "canvas", "events": { "onhover": { "enable": true, "mode": "grab" } } } });
        function toggleLoginPass() {
            const field = document.getElementById("loginPassField");
            const icon = document.querySelector(".show-pass-icon");
            if (field.type === "password") { field.type = "text"; icon.classList.remove("fa-eye"); icon.classList.add("fa-eye-slash"); } else { field.type = "password"; icon.classList.remove("fa-eye-slash"); icon.classList.add("fa-eye"); }
        }
    </script>
</body>
</html>
