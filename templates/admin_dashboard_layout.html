<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="ZERO (Sobhan) - t.me/fesqhli">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت | TechBlog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;500;900&display=swap');
        
        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: #f4f6f9;
            overflow-x: hidden;
        }

        /* سایدبار سمت راست (خاص و مدرن) */
        .sidebar {
            width: 260px;
            height: 100vh;
            background: linear-gradient(180deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            position: fixed;
            top: 0;
            right: 0;
            color: white;
            padding: 20px;
            box-shadow: -5px 0 25px rgba(0,0,0,0.3);
            z-index: 1000;
            border-left: 1px solid rgba(255,255,255,0.1);
        }

        .sidebar-header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .sidebar-header h3 {
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.7); /* افکت نوری متن */
        }

        .nav-link {
            color: rgba(255,255,255,0.7);
            padding: 14px 15px;
            border-radius: 12px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        /* افکت هاور جذاب */
        .nav-link:hover, .nav-link.active {
            background: rgba(255,255,255,0.1);
            color: white;
            transform: translateX(-5px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        
        .nav-link.active::before {
            content: '';
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: #00d2ff;
            box-shadow: 0 0 10px #00d2ff;
        }

        .nav-link i {
            margin-left: 15px;
            font-size: 1.4rem;
            transition: 0.3s;
        }
        
        .nav-link:hover i {
            transform: scale(1.2);
            color: #00d2ff;
        }

        /* محتوای اصلی */
        .main-content {
            margin-right: 260px;
            padding: 40px;
            transition: 0.3s;
            min-height: 100vh;
        }

        /* استایل‌های عمومی داشبورد */
        .stat-card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: 0.3s;
            border: none;
            position: relative;
            overflow: hidden;
        }
        .stat-card::after {
            content: ''; position: absolute; top: 0; right: 0; width: 100%; height: 5px;
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
        }
        .stat-card:hover { transform: translateY(-5px); box-shadow: 0 15px 40px rgba(0,0,0,0.1); }

        .stat-icon {
            width: 60px; height: 60px;
            border-radius: 15px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.8rem;
            background: rgba(0, 210, 255, 0.1);
            color: #00d2ff;
        }

        /* جدول مدرن */
        .table-custom {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
        .table-custom th { background: #f8f9fa; border-bottom: 2px solid #eee; color: #555; padding: 15px; }
        .table-custom td { vertical-align: middle; padding: 15px; border-bottom: 1px solid #f8f9fa; }
        .table-custom tr:last-child td { border-bottom: none; }
        .table-custom tr:hover td { background-color: #fafafa; }

        @media (max-width: 768px) {
            .sidebar { width: 80px; padding: 10px; }
            .sidebar-header h3, .nav-link span { display: none; }
            .nav-link { justify-content: center; padding: 15px 0; }
            .nav-link i { margin: 0; font-size: 1.6rem; }
            .main-content { margin-right: 80px; padding: 20px; }
        }
    </style>
</head>
<body>

    <!-- سایدبار -->
    <nav class="sidebar">
        <div class="sidebar-header">
            <h3 class="fw-bold">Tech<span class="fw-light text-info">Admin</span></h3>
        </div>
        <ul class="nav flex-column">
            <li class="nav-item">
                <a class="nav-link {{ 'active' if request.endpoint == 'admin_dashboard' }}" href="/admin/dashboard">
                    <i class="bi bi-grid-fill"></i> <span>داشبورد</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link {{ 'active' if request.endpoint == 'admin_users' }}" href="/admin/users">
                    <i class="bi bi-people-fill"></i> <span>کاربران</span>
                </a>
            </li>
            
            <!-- لینک جدید مدیریت دسته‌ها -->
            <li class="nav-item">
                <a class="nav-link {{ 'active' if request.endpoint == 'admin_categories' }}" href="/admin/categories">
                    <i class="bi bi-tags-fill"></i> <span>دسته‌بندی‌ها</span>
                </a>
            </li>
            
            <li class="nav-item">
                <a class="nav-link {{ 'active' if request.endpoint == 'new_post' }}" href="/post/new">
                    <i class="bi bi-pencil-square"></i> <span>پست جدید</span>
                </a>
            </li>
            
            <li class="nav-item mt-4 border-top pt-3" style="border-color: rgba(255,255,255,0.1) !important;">
                <a class="nav-link" href="/">
                    <i class="bi bi-globe"></i> <span>مشاهده سایت</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-danger" href="/logout">
                    <i class="bi bi-box-arrow-right"></i> <span>خروج</span>
                </a>
            </li>
        </ul>
    </nav>

    <!-- محتوای متغیر -->
    <div class="main-content">
        {% block admin_content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
